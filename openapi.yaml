    /diary/search:
        get:
            operationId: get_diary_search
            parameters:
                - in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    type: string
                - in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    type: string
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 20
                    maximum: 10000
                    minimum: 1
                    type: integer
                - explode: true
                  in: query
                  name: query
                  required: false
                  schema:
                    items:
                        type: string
                    type: array
