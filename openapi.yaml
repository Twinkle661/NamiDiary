                    description: Embedding provider, request or response error.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 'Busy: retry after 10 seconds.'
                    headers:
                        Retry-After:
                            description: Retry delay in seconds.
                            schema:
                                const: "10"
                                type: string
            summary: Read a diary with front matter
        post:
            description: Date is checked in app.timezone. An embedding failure still stores the entry; its vector is backfilled by normalize. Memory work does not delay the response.
            operationId: post_diary_date
            parameters:
                - in: path
                  name: date
                  required: true
