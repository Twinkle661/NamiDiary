components:
    schemas:
        Accepted:
            additionalProperties: false
            properties:
                job:
                    enum:
                        - maintenance
                        - init
                        - restore
                status:
                    const: accepted
            required:
                - status
                - job
            type: object
        Added:
            additionalProperties: false
            properties:
                id:
                    type: integer
                message:
                    type: string
                status:
                    const: success
            required:
                - status
                - message
                - id
            type: object
        Aliases:
            additionalProperties: false
            properties:
                aliases:
                    items:
                        maxLength: 64
                        minLength: 1
                        type: string
                    maxItems: 10
                    type: array
            required:
                - aliases
            type: object
        DiaryMeta:
            additionalProperties: false
            properties:
                keywords:
                    items:
                        type: string
                    type: array
                location:
                    maxLength: 200
                    type: string
                summary:
                    type: string
            required: []
            type: object
        DiaryPatch:
            additionalProperties: false
            properties:
                content:
                    type: string
                meta:
                    additionalProperties: false
                    properties:
                        keywords:
                            items:
                                type: string
                            type: array
                        summary:
                            type: string
                    required: []
                    type: object
            required: []
            type: object
        DiaryWrite:
            additionalProperties: false
            properties:
                content:
                    minLength: 1
                    type: string
                meta:
                    $ref: '#/components/schemas/DiaryMeta'
            required:
                - content
            type: object
        Directory:
            additionalProperties: false
            properties:
                area:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                core:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                people:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                project:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
            required:
                - core
                - people
                - area
                - project
            type: object
        Entry:
            additionalProperties: false
            properties:
                content:
                    type: string
                id:
                    type: integer
                sources:
                    items:
                        format: date
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        type: string
                    type: array
                updated:
                    format: date-time
                    type: string
                updated_by:
                    enum:
                        - dream
                        - agent
                        - user
            required:
                - id
                - content
                - sources
                - updated
                - updated_by
            type: object
        Error:
            additionalProperties: false
            properties:
                code:
                    enum:
                        - INVALID_REQUEST
                        - UNAUTHORIZED
                        - FORBIDDEN_ORIGIN
                        - NOT_FOUND
                        - CONFLICT
                        - DATE_TOO_FAR_AHEAD
                        - PATCH_WINDOW_EXPIRED
                        - ENTRY_TOO_LONG
                        - CORE_TOPIC_RESTRICTED
                        - KIND_MISMATCH
                        - TOPIC_LIMIT_REACHED
                        - TOPIC_ARCHIVED
                        - ALIAS_CONFLICT
                        - MEMORY_BUSY
                        - DIARY_BUSY
                        - EMBEDDING_CONFIG_ERROR
                        - EMBEDDING_REQUEST_ERROR
                        - EMBEDDING_PROVIDER_ERROR
                        - EMBEDDING_RESPONSE_ERROR
                        - LLM_REQUEST_ERROR
                        - LLM_RESPONSE_ERROR
                        - DIARY_PARSE_ERROR
                        - INTERNAL_ERROR
                    type: string
                debug:
                    additionalProperties: false
                    properties:
                        error:
                            type: string
                    required:
                        - error
                    type: object
                details:
                    additionalProperties: true
                    type: object
                message:
                    type: string
                status:
                    const: error
            required:
                - status
                - code
                - message
            type: object
        Health:
            additionalProperties: false
            properties:
                status:
                    const: ok
            required:
                - status
            type: object
        Job:
            additionalProperties: false
            properties:
                attempt:
                    type: integer
                error:
                    type: string
                finished:
                    type: string
                ok:
                    type: boolean
                started:
                    type: string
                step:
                    type: string
                summary:
                    type: string
                type:
                    enum:
                        - dream
                        - maintenance
                        - init
                        - restore
            required:
                - type
                - started
                - ok
            type: object
        MemoryAdd:
            additionalProperties: false
            properties:
                aliases:
                    items:
                        type: string
                    type: array
                content:
                    description: At most memory.entry_max_chars Unicode code points (default 200).
                    minLength: 1
                    type: string
                kind:
                    enum:
                        - core
                        - people
                        - area
                        - project
                sources:
                    items:
                        format: date
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        type: string
                    type: array
                topic:
                    maxLength: 64
                    minLength: 1
                    type: string
            required:
                - topic
                - content
            type: object
        MemoryUpdate:
            additionalProperties: false
            properties:
                content:
                    minLength: 1
                    type: string
                sources:
                    items:
                        format: date
                        pattern: ^\d{4}-\d{2}-\d{2}$
                        type: string
                    type: array
            required:
                - content
            type: object
        Message:
            additionalProperties: false
            properties:
                role:
                    minLength: 1
                    type: string
                text:
                    type: string
            required:
                - role
                - text
            type: object
        Restore:
            additionalProperties: false
            properties:
                snapshot:
                    pattern: ^[0-9]{8}T[0-9]{6}Z(?:-[0-9]+)?$
                    type: string
            required: []
            type: object
        Similar:
            additionalProperties: false
            properties:
                recent:
                    items:
                        $ref: '#/components/schemas/Message'
                    type: array
                user_message:
                    type: string
            required: []
            type: object
        Status:
            additionalProperties: false
            properties:
                busy:
                    type: boolean
                current_job:
                    anyOf:
                        - $ref: '#/components/schemas/Job'
                        - type: "null"
                last_jobs:
                    items:
                        $ref: '#/components/schemas/Job'
                    type: array
                last_snapshot:
                    type: string
                pending_archives:
                    items:
                        type: string
                    type: array
                pending_dream:
                    type: boolean
                violations:
                    items:
                        $ref: '#/components/schemas/Violation'
                    type: array
            required:
                - busy
                - current_job
                - pending_dream
                - last_jobs
                - violations
                - pending_archives
                - last_snapshot
            type: object
        Success:
            additionalProperties: false
            properties:
                message:
                    type: string
                status:
                    const: success
            required:
                - status
                - message
            type: object
        Topic:
            additionalProperties: false
            properties:
                aliases:
                    items:
                        type: string
                    type: array
                archived:
                    type:
                        - string
                        - "null"
                entries:
                    items:
                        $ref: '#/components/schemas/Entry'
                    type: array
                kind:
                    enum:
                        - core
                        - people
                        - area
                        - project
                topic:
                    type: string
            required:
                - topic
                - kind
                - aliases
                - archived
                - entries
            type: object
        Violation:
            additionalProperties: false
            properties:
                entries:
                    type: integer
                kind:
                    type: string
                max:
                    type: integer
                topic:
                    type: string
                topics:
                    type: integer
            required:
                - kind
                - max
            type: object
    securitySchemes:
        bearerAuth:
            scheme: bearer
            type: http
info:
    description: Single-user service. All request bodies are limited to 1 MiB. Configurable defaults in schemas are illustrative. MCP streamable HTTP is mounted at /mcp and follows the MCP protocol, separate from these REST operations.
    title: Diary and memory API
    version: 1.0.0
openapi: 3.1.0
paths:
    /context/dynamic:
        post:
            description: Uses the same validation and retrieval as diary/similar. The recent query parameter sets the result count (defaults to diary.similar_limit; recent=0 omits the section). It is unrelated to the recent field in the body. No deduplication against static context.
            operationId: post_context_dynamic
            parameters:
                - in: query
                  name: recent
                  required: false
                  schema:
                    default: 15
                    maximum: 60
                    minimum: 0
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Similar'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    content:
                                        type: string
                                required:
                                    - content
                                type: object
                    description: Success
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid request, length, core-topic or future-date constraint.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: MCP host or origin forbidden.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Conflict, expired patch window, kind/alias/topic-cap or archived-topic constraint.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal, diary parse or embedding configuration error.
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Embedding provider, request or response error.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 'Busy: retry after 10 seconds.'
                    headers:
                        Retry-After:
                            description: Retry delay in seconds.
                            schema:
                                const: "10"
                                type: string
            summary: Related diary summaries, least similar first
    /context/static:
        get:
            description: Bounds/defaults are configurable. recent=0 omits diary summaries. Empty content sections are omitted.
            operationId: get_context_static
            parameters:
                - in: query
                  name: recent
                  required: false
                  schema:
                    default: 7
                    maximum: 60
                    minimum: 0
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    content:
                                        type: string
                                required:
                                    - content
                                type: object
                    description: Success
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid request, length, core-topic or future-date constraint.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Missing or invalid bearer token.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: MCP host or origin forbidden.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Resource not found.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Conflict, expired patch window, kind/alias/topic-cap or archived-topic constraint.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal, diary parse or embedding configuration error.
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Embedding provider, request or response error.
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 'Busy: retry after 10 seconds.'
                    headers:
                        Retry-After:
                            description: Retry delay in seconds.
                            schema:
                                const: "10"
                                type: string
            summary: Recent summaries, core memory, then directory
    /diary/{date}:
        get:
            operationId: get_diary_date
            parameters:
                - in: path
                  name: date
                  required: true
                  schema:
                    format: date
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    content:
                                        type: string
                                required:
                                    - content
                                type: object
                    description: Success
                "400":
