services:
  diary:
    image: namidiary:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - ./data:/app/data
      - ./config.yml:/app/config.yml:ro
    env_file: .env
    healthcheck:
      test: ["CMD", "/app/namidiary", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
